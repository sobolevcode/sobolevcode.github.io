<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заглушка</title>
    <style>
        /* Сброс стандартных отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f9fa;
        }

        .placeholder {
            padding: 40px 60px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .placeholder h1 {
            font-size: 36px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 0.5px;
        }

        .placeholder p {
            margin-top: 12px;
            font-size: 18px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <h1>Заглушка</h1>
        <p>Страница в разработке</p>
    </div>
</body>
</html>
